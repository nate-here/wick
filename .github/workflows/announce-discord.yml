name: Announce release on Discord

# Posts just the version number (e.g. "v1.0.2") to a Discord channel via webhook
# whenever a release is published on this repo. Also runnable manually.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to post (e.g. v1.0.2). Blank = latest."
        required: false

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Post version to Discord
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "::error::DISCORD_WEBHOOK secret is not set on this repo."
            exit 1
          fi

          # Choose the tag: release event > manual input > latest published.
          TAG="${EVENT_TAG:-}"
          [ -z "$TAG" ] && TAG="${INPUT_TAG:-}"
          if [ -z "$TAG" ]; then
            TAG=$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')
          fi

          PAYLOAD=$(jq -n --arg v "$TAG" '{content: $v}')
          curl -fsSL -X POST -H "Content-Type: application/json" \
            --data "$PAYLOAD" "$DISCORD_WEBHOOK"
          echo "Posted $TAG to Discord."
