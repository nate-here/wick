name: Redeploy site on release

# When a release is published or edited on this repo, ping the Vercel deploy
# hook so trywick.co rebuilds and picks up the new version, changelog, and .dmg
# automatically. Also runnable manually (workflow_dispatch) to test the hook.
on:
  release:
    types: [published, edited]
  workflow_dispatch: {}

permissions: {}

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK secret is not set on this repo."
            exit 1
          fi
          curl -fsSL -X POST "$HOOK"
          echo "Deploy hook triggered."
